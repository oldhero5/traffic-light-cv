[tool:pytest]
minversion = 7.4
addopts = 
    --strict-markers
    --strict-config
    --verbose
    -ra
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers for M1 testing
markers =
    m1_required: Tests that require M1 hardware/MPS support
    performance: Performance benchmark tests
    integration: Integration tests
    unit: Unit tests
    slow: Tests that take longer to run

# Filter warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test discovery patterns
norecursedirs = 
    .git 
    .tox 
    dist 
    build 
    *.egg
    node_modules
    .pytest_cache