# Detection model training configuration

# Training settings
data: data/dataset.yaml
epochs: 100
batch_size: 16
img_size: 640
weights: yolov8s.pt
output: models
device: ""  # Auto-select (empty string)
workers: 8
project: traffic_detection
name: exp

# Model settings
model:
  type: yolov8
  size: s  # n, s, m, l, x
  pretrained: true

# Dataset settings
dataset:
  train: data/train
  val: data/val
  test: data/test
  nc: 7  # Number of classes
  names: [
    "traffic_light_unknown",
    "traffic_light_red",
    "traffic_light_yellow",
    "traffic_light_green",
    "traffic_camera",
    "speed_camera",
    "red_light_camera"
  ]

# Hyperparameter settings
hyp:
  lr0: 0.01  # Initial learning rate
  lrf: 0.01  # Final learning rate fraction
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  box: 0.05
  cls: 0.5
  cls_pw: 1.0
  obj: 1.0
  obj_pw: 1.0
  iou_t: 0.2
  anchor_t: 4.0
  fl_gamma: 0.0
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0

# Augmentation settings
augmentation:
  mosaic: true
  mixup: true
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flip_ud: 0.0
  flip_lr: 0.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  paste_in: 0.15