# Logging configuration
version: 1
disable_existing_loggers: False

formatters:
  simple:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: simple
    filename: output/traffic_perception.log

loggers:
  '': # root logger
    handlers: [console, file]
    level: INFO
    propagate: True

  'detection': # detection module
    handlers: [console, file]
    level: INFO
    propagate: False

  'localization': # localization module
    handlers: [console, file]
    level: INFO
    propagate: False

  'mapping': # mapping module
    handlers: [console, file]
    level: INFO
    propagate: False

  'relevance': # relevance module
    handlers: [console, file]
    level: INFO
    propagate: False